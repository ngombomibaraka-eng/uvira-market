<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <meta name="theme-color" content="#2D6A4F" />
    <title>UviraMarket — Marché numérique de Uvira 2026</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <style>
        :root {
            --primary: #C45D2C;
            --primary-dark: #A84D22;
            --secondary: #2D6A4F;
            --secondary-light: #409f7a;
            --accent: #D4A017;
            --brown: #2D1810;
            --brown-light: #5C3D2E;
            --brown-muted: #8A7A6A;
            --cream: #FDF8F3;
            --cream-dark: #F5ECE3;
            --border: #E8DDD6;
            --danger: #DC3545;
            --success: #22C55E;
            --font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --shadow: 0 4px 24px rgba(45, 24, 16, 0.08);
            --shadow-hover: 0 8px 32px rgba(45, 24, 16, 0.14);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.25s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: #F8F4F0;
            color: var(--brown);
            -webkit-font-smoothing: antialiased;
            padding-bottom: 70px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }
        button {
            border: none;
            background: none;
            cursor: pointer;
        }
        img {
            max-width: 100%;
            display: block;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--cream);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .text-brown {
            color: var(--brown) !important;
        }
        .text-brown-muted {
            color: var(--brown-muted) !important;
        }
        .text-primary {
            color: var(--primary) !important;
        }
        .text-secondary {
            color: var(--secondary) !important;
        }
        .text-accent {
            color: var(--accent) !important;
        }
        .bg-cream {
            background-color: var(--cream) !important;
        }
        .bg-cream-dark {
            background-color: var(--cream-dark) !important;
        }
        .border-border {
            border-color: var(--border) !important;
        }
        .fw-800 {
            font-weight: 800 !important;
        }

        .btn-primary-custom {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.875rem;
            transition: var(--transition);
        }
        .btn-primary-custom:hover {
            background: var(--primary-dark);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(196, 93, 44, 0.3);
        }

        .btn-secondary-custom {
            background: var(--secondary);
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.875rem;
            transition: var(--transition);
        }
        .btn-secondary-custom:hover {
            background: var(--secondary-light);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(45, 106, 79, 0.3);
        }

        .btn-outline-custom {
            background: transparent;
            color: var(--brown);
            border: 2px solid var(--border);
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.875rem;
            transition: var(--transition);
        }
        .btn-outline-custom:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(196, 93, 44, 0.05);
        }

        .btn-danger-custom {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.875rem;
            transition: var(--transition);
        }
        .btn-danger-custom:hover {
            background: #c82333;
            color: #fff;
        }

        .sec-bar {
            width: 4px;
            height: 20px;
            border-radius: 4px;
            background: linear-gradient(180deg, var(--primary), var(--accent));
            display: inline-block;
            margin-right: 8px;
        }

        .badge-promo {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--danger);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 50px;
            letter-spacing: 0.3px;
            z-index: 2;
            box-shadow: 0 2px 8px rgba(220, 53, 69, 0.3);
        }

        .app-header {
            background: #fff;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1050;
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.95);
        }

        .nav-link-custom {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--brown-muted);
            padding: 6px 12px;
            border-radius: 8px;
            transition: var(--transition);
            cursor: pointer;
        }
        .nav-link-custom:hover {
            color: var(--brown);
            background: var(--cream);
        }
        .nav-link-custom.active {
            color: var(--primary);
            background: rgba(196, 93, 44, 0.08);
        }

        .notif-dot {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 8px;
            height: 8px;
            background: var(--danger);
            border-radius: 50%;
            border: 2px solid #fff;
        }

        .avatar {
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }
        .avatar-ph {
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            flex-shrink: 0;
        }

        /* ===== CARTE PRODUIT ===== */
        .p-card {
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: var(--transition);
            height: 100%;
        }
        .p-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .p-img {
            position: relative;
            overflow: hidden;
            aspect-ratio: 1/1;
            cursor: pointer;
            background: var(--cream);
        }
        .p-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .p-card:hover .p-img img {
            transform: scale(1.03);
        }

        .like-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            transition: var(--transition);
            z-index: 5;
        }
        .like-btn:hover {
            transform: scale(1.1);
        }
        .like-btn.liked {
            background: rgba(220, 53, 69, 0.12);
        }
        .like-btn.liked i {
            color: var(--danger) !important;
        }

        .heart-pop {
            animation: heartPop 0.35s ease;
        }
        @keyframes heartPop {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.4);
            }
            100% {
                transform: scale(1);
            }
        }

        /* ===== CATÉGORIES ===== */
        .cat-card {
            background: #fff;
            border-radius: var(--radius-sm);
            padding: 12px 8px;
            text-align: center;
            border: 1px solid var(--border);
            transition: var(--transition);
            cursor: pointer;
            height: 100%;
        }
        .cat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow);
            border-color: var(--primary);
        }
        .cat-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            margin: 0 auto 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        /* ===== PANIER ===== */
        .cart-side {
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            position: sticky;
            top: 80px;
        }

        .cart-hd {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .c-list {
            max-height: 320px;
            overflow-y: auto;
            padding: 8px 12px;
        }

        .c-it {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(232, 221, 214, 0.4);
        }
        .c-it:last-child {
            border-bottom: none;
        }

        .c-inf {
            flex: 1;
            min-width: 0;
        }
        .c-nm {
            font-size: 0.75rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .c-pr {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--primary);
        }

        .c-qty {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--cream);
            border-radius: 30px;
            padding: 2px 4px;
        }
        .c-qty button {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid var(--border);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .c-qty button:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .c-qty span {
            font-size: 0.8rem;
            font-weight: 600;
            min-width: 20px;
            text-align: center;
        }

        .c-rm {
            color: var(--brown-muted);
            font-size: 0.7rem;
            padding: 4px;
            transition: var(--transition);
        }
        .c-rm:hover {
            color: var(--danger);
        }

        .c-ft {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .c-tot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .btn-ck {
            background: var(--secondary);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.8rem;
            transition: var(--transition);
            width: 100%;
        }
        .btn-ck:hover {
            background: var(--secondary-light);
            color: #fff;
        }
        .btn-ck:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-cl {
            background: transparent;
            color: var(--brown-muted);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 50px;
            font-size: 0.75rem;
            transition: var(--transition);
            width: 100%;
        }
        .btn-cl:hover {
            background: var(--cream);
            color: var(--brown);
        }

        .c-emp {
            text-align: center;
            padding: 30px 10px;
            color: var(--brown-muted);
        }
        .c-emp i {
            font-size: 2rem;
            opacity: 0.2;
            margin-bottom: 8px;
            display: block;
        }

        /* ===== MESSAGERIE ===== */
        .chat-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .conv-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(232, 221, 214, 0.4);
            cursor: pointer;
            transition: var(--transition);
        }
        .conv-item:hover {
            background: var(--cream);
        }
        .conv-item.active {
            background: rgba(196, 93, 44, 0.06);
            border-left: 3px solid var(--primary);
        }

        .unread-badge {
            background: var(--primary);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 50px;
            min-width: 20px;
            text-align: center;
        }

        .chat-area {
            max-height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px 16px;
            background: var(--cream);
        }

        .msg-bubble {
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 0.8rem;
            max-width: 80%;
            word-break: break-word;
            line-height: 1.5;
        }
        .msg-mine {
            background: var(--primary);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg-other {
            background: #fff;
            color: var(--brown);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .msg-system {
            text-align: center;
            font-size: 0.7rem;
            color: var(--brown-muted);
            padding: 4px 0;
        }
        .msg-time {
            font-size: 0.6rem;
            color: var(--brown-muted);
        }
        .chk-read {
            color: #4CAF50;
        }
        .chk-unread {
            color: var(--brown-muted);
        }

        /* ===== DASHBOARD ===== */
        .dash-stat {
            background: #fff;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
        }
        .dash-stat:hover {
            box-shadow: var(--shadow);
        }
        .dash-stat-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .dash-card {
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 20px;
            margin-bottom: 16px;
        }

        .dash-tab {
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--brown-muted);
            transition: var(--transition);
        }
        .dash-tab:hover {
            border-color: var(--primary);
            color: var(--brown);
        }
        .dash-tab.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* ===== TABLEAUX ===== */
        .at {
            width: 100%;
            font-size: 0.8rem;
            border-collapse: collapse;
        }
        .at th {
            text-align: left;
            font-weight: 600;
            color: var(--brown-muted);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 8px 10px;
            border-bottom: 2px solid var(--border);
        }
        .at td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(232, 221, 214, 0.4);
            vertical-align: middle;
        }
        .at tr:hover td {
            background: rgba(196, 93, 44, 0.02);
        }

        .st-badge {
            padding: 2px 12px;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-block;
            white-space: nowrap;
        }

        .crud-btn {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 500;
            border: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .crud-btn:hover {
            opacity: 0.8;
        }
        .crud-edit {
            background: rgba(45, 106, 79, 0.12);
            color: var(--secondary);
        }
        .crud-del {
            background: rgba(220, 53, 69, 0.12);
            color: var(--danger);
        }
        .crud-view {
            background: rgba(196, 93, 44, 0.1);
            color: var(--primary);
        }

        /* ===== FORMULAIRES ===== */
        .fi {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-family: var(--font-family);
            transition: var(--transition);
            background: #fff;
        }
        .fi:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(196, 93, 44, 0.1);
        }
        .fi-sel {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-family: var(--font-family);
            background: #fff;
            transition: var(--transition);
        }
        .fi-sel:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(196, 93, 44, 0.1);
        }

        .up-z {
            border: 2px dashed var(--border);
            border-radius: var(--radius-sm);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }
        .up-z:hover {
            border-color: var(--primary);
            background: rgba(196, 93, 44, 0.04);
        }
        .up-z input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* ===== TOAST ===== */
        #toast-box {
            position: fixed;
            bottom: 80px;
            right: 16px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 320px;
            width: 100%;
        }
        .toast {
            background: #fff;
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            box-shadow: var(--shadow-hover);
            border-left: 4px solid var(--secondary);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            animation: slideIn 0.35s ease;
            border: 1px solid var(--border);
        }
        .toast.ok {
            border-left-color: var(--success);
        }
        .toast.err {
            border-left-color: var(--danger);
        }
        .toast.inf {
            border-left-color: var(--accent);
        }
        .toast.out {
            animation: slideOut 0.35s ease forwards;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(40px);
            }
        }

        /* ===== MODAL ===== */
        #modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        #modal-overlay.hidden {
            display: none;
        }
        #modal-content {
            background: #fff;
            border-radius: var(--radius);
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* ===== TOGGLE ===== */
        .toggle {
            position: relative;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }
        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            inset: 0;
            background: #ccc;
            border-radius: 30px;
            transition: var(--transition);
            cursor: pointer;
        }
        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: var(--transition);
        }
        .toggle input:checked+.toggle-slider {
            background: var(--secondary);
        }
        .toggle input:checked+.toggle-slider::before {
            transform: translateX(20px);
        }
        .toggle input:disabled+.toggle-slider {
            opacity: 0.5;
        }

        /* ===== PAGE PARAMS ===== */
        .params-sec {
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 20px;
            margin-bottom: 16px;
        }
        .params-sec h3 {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--brown);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .params-sec h3 i {
            color: var(--primary);
        }
        .params-sec p,
        .params-sec li {
            font-size: 0.85rem;
            color: var(--brown-muted);
            line-height: 1.7;
        }
        .params-sec ul {
            padding-left: 20px;
            margin: 0;
        }
        .params-sec li {
            margin-bottom: 4px;
        }

        .role-card {
            background: var(--cream);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            transition: var(--transition);
        }

                g[dv].items.push({ ...c, product: p });
                g[dv].total += (p.prixPromo || p.prix) * c.qty;

            return `<div class="avatar-ph" style="width:${sz}px;height:${sz}px;background:${cl}12;color:${cl};font-size:${fs}px">${(nom||'?')[0].toUpperCase()}</div>`;

        /* ===== SÉCURITÉ ===== */

        async function hashPassword(pwd) {
            const e = new TextEncoder();
            const d = e.encode(pwd + 'uv5_salt_2026!');
            const h = await crypto.subtle.digest('SHA-256', d);
            return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function getUsersDB() {
            return JSON.parse(localStorage.getItem('uv5_users_db') || '[]');

        function saveUsersDB(db) {

        }

        function createSessionToken(uid) {
            const t = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2) + '_' + uid;
            localStorage.setItem('uv5_session', JSON.stringify({ token: t, userId: uid, expiry: Date.now() +
                    86400000 }));
            return t;
        }

        function validateSession() {
            const s = JSON.parse(localStorage.getItem('uv5_session') || 'null');
            if (!s) return null;
            if (Date.now() > s.expiry) {
                localStorage.removeItem('uv5_session');
                return null;
            }
            const db = getUsersDB();
            const u = db.find(x => x.id === s.userId);
            if (!u || !u.actif) {
                localStorage.removeItem('uv5_session');
                return null;
            }
            return u;
        }

        async function registerUser(nom, email, pwd, role) {
            const db = getUsersDB();
            if (db.find(u => u.email === email.toLowerCase())) return { ok: false, msg: 'Cet email est déjà utilisé.' };
            if (pwd.length < 6) return { ok: false, msg: 'Mot de passe : minimum 6 caractères.' };
            const h = await hashPassword(pwd);
            const nu = {
                id: Date.now(),
                nom: nom,
                email: email.toLowerCase(),
                passwordHash: h,
                role: role || 'acheteur',
                photo: null,
                telephone: '',
                adresse: '',
                actif: true,
                dateInscription: new Date().toISOString().slice(0, 10)
            };
            db.push(nu);
            saveUsersDB(db);
            return { ok: true, user: nu };
        }

        async function authenticateUser(email, pwd) {
            const db = getUsersDB();
            const u = db.find(x => x.email === email.toLowerCase());
            if (!u) return { ok: false, msg: 'Email ou mot de passe incorrect.' };
            if (!u.actif) return { ok: false, msg: 'Compte désactivé.' };
            const h = await hashPassword(pwd);
            if (h !== u.passwordHash) return { ok: false, msg: 'Email ou mot de passe incorrect.' };
            createSessionToken(u.id);
            return { ok: true, user: u };
        }

            input.value = '';

            setTimeout(() => {
                const botDiv = document.createElement('div');
                botDiv.className = 'ia-msg bot';

                body.scrollTop = body.scrollHeight;

        function getIAResponse(msg) {
            const m = msg.toLowerCase();
            if (m.includes('bonjour') || m.includes('salut')) {
                return '👋 Bonjour ! Comment puis-je vous aider aujourd\'hui ?';
            }
            if (m.includes('produit') || m.includes('acheter') || m.includes('catalogue')) {
                return '🛍️ Vous pouvez parcourir notre catalogue complet en cliquant sur "Catalogue" dans le menu. Vous y trouverez des produits d\'agriculture, élevage, pêche, mode, électronique et bien plus encore !';
            }
            if (m.includes('commande') || m.includes('panier')) {
                return '📦 Pour passer une commande : ajoutez des produits au panier, puis cliquez sur "Commander". Vous serez guidé pour finaliser votre commande. Important : une commande ne peut contenir que des produits d\'un seul vendeur.';
            }
            if (m.includes('vendeur') || m.includes('boutique')) {
                return '🏪 Les vendeurs sont des commerçants locaux d\'Uvira et ses environs. Chaque produit affiche le nom et la boutique du vendeur. Vous pouvez discuter directement avec eux via la messagerie après une commande.';
            }
            if (m.includes('paiement') || m.includes('payer')) {
                return '💳 Les paiements se font via Mobile Money (Airtel Money, Orange Money, M-Pesa). Le vendeur vous confirmera la réception du paiement dans la messagerie.';

            if (m.includes('livraison') || m.includes('livreur')) {

            }
            if (m.includes('aide') || m.includes('support')) {
                return '🆘 Besoin d\'aide ? Contactez-nous à support@uviramarket.cd ou appelez le +243 837 373 464. Notre équipe est disponible 24h/24.';

              ${S.notifs.slice(0,6).map(n => `
                <div class="px-3 py-2 hover-bg-cream ${n.lu?'text-brown-muted':'fw-500 bg-primary bg-opacity-5'}" 
                     style="font-size:0.75rem;cursor:pointer;transition:background 0.2s;"

                fb.style.display = n ? 'flex' : 'none';

        /* ===== PAGE RENDER ===== */

        function renderPage() {
            const pagesProtegees = ['checkout', 'vendor-dash', 'admin-dash', 'profile', 'messages', 'orders', 'favorites',
                'params'
            ];
            if (pagesProtegees.indexOf(S.page) !== -1) {
                const vu = validateSession();
                if (!vu) {
                    toast('Connectez-vous pour accéder', 'err');
                    S.page = 'login';
                } else {
                    S.user = vu;
                }
            }

            const m = document.getElementById('app-main');
            const fn = {
                home: pgHome,
                catalog: pgCat,
                product: pgProd,
                checkout: pgCk,
                login: pgLogin,
                register: pgReg,
                'vendor-dash': pgVend,
                'admin-dash': pgAdmin,
                profile: pgProf,
                messages: pgMsgs,
                orders: pgOrds,
                favorites: pgFavs,
                params: pgParams

        /* ===== PAGE ACCUEIL ===== */

        function pgHome() {
            const pop = [...S.products].filter(p => p.actif !== false).sort((a, b) => b.ventes - a.ventes).slice(0, 8);
            const promos = S.products.filter(p => p.enPromotion && p.actif !== false).slice(0, 4);
            const ad = S.ads.filter(a => a.active)[0];

            return `

            <section class="hero-gradient py-5" style="min-height:320px;">
              <div class="container py-3">
                <div class="row align-items-center">

                    <div class="d-inline-flex align-items-center gap-2 bg-white bg-opacity-10 rounded-pill px-3 py-1 mb-3">
                      <span class="badge bg-accent rounded-pill" style="width:8px;height:8px;padding:0;"></span>
                      <span style="font-size:0.7rem;opacity:0.7;">Marché numérique d'Uvira — 2026</span>
                    </div>
                    <h1 class="display-5 fw-800" style="line-height:1.1;">Achetez local,<br><span class="text-accent">simplement et vite</span></h1>
                    <p class="opacity-75 mt-3" style="font-size:0.9rem;max-width:400px;">Agriculteurs, pêcheurs, artisans. Ajoutez au panier, payez, suivez par message avec le vendeur et le livreur.</p>
                    <div class="d-flex flex-wrap gap-2 mt-3">
                      <button class="btn btn-primary-custom" onclick="document.getElementById('prod-zone')?.scrollIntoView({behavior:'smooth'})">
                        <i class="fas fa-search me-1"></i> Voir les produits
                      </button>
                      <button class="btn btn-outline-light" onclick="go('register')" style="border-color:rgba(255,255,255,0.3);">
                        <i class="fas fa-store me-1"></i> Devenir vendeur
                      </button>
                    </div>
                    <div class="d-flex gap-4 mt-4">
                      <div><span class="fw-800 fs-4">${S.products.filter(p=>p.actif!==false).length}+</span><br><span class="opacity-50" style="font-size:0.7rem;">Produits</span></div>
                      <div class="vr opacity-25"></div>
                      <div><span class="fw-800 fs-4">${VEND.filter(v=>v.actif).length}</span><br><span class="opacity-50" style="font-size:0.7rem;">Vendeurs</span></div>
                      <div class="vr opacity-25"></div>
                      <div><span class="fw-800 fs-4">2026</span><br><span class="opacity-50" style="font-size:0.7rem;">Année</span></div>
                    </div>
                  </div>
                  <div class="col-lg-6 d-none d-lg-block">
                    <div class="row g-2">
                      ${pop.slice(0,4).map((p,i) => `
                        <div class="col-6 ${i%2?'mt-4':''}" onclick="go('product',${p.id})" style="cursor:pointer;">
                          <div class="bg-white bg-opacity-10 rounded-3 p-2 h-100 hover-bg-white hover-bg-opacity-15 transition">
                            <img src="${p.images[0]}" class="w-100 rounded-2" style="height:80px;object-fit:cover;">
                            <div class="text-white fw-600" style="font-size:0.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.nom}</div>
                            <div class="text-accent fw-700" style="font-size:0.8rem;">${fmt(p.prixPromo||p.prix,p.devise)}</div>
                          </div>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <!-- Publicité -->
            ${ad ? `
              <div class="container mt-n3 mb-4">
                <div class="ad-banner bg-white p-3">
                  <div class="d-flex flex-column flex-sm-row align-items-center gap-3">
                    <img src="${ad.image}" class="rounded-3" style="width:100%;max-width:200px;height:100px;object-fit:cover;">
                    <div class="flex-grow-1">
                      <div class="ad-tag"><i class="fas fa-bullhorn me-1"></i>Publicité</div>
                      <h5 class="fw-700 text-brown mt-1">${ad.titre}</h5>
                      <p class="text-brown-muted" style="font-size:0.8rem;">${ad.texte}</p>
                    </div>
                  </div>
                </div>
              </div>
            ` : ''}

            <!-- Catégories -->
            <div class="container py-3">
              <div class="row g-2">
                ${CATS.map(c => `
                  <div class="col-3 col-sm-2 col-md-1" onclick="S.filters.catId=${c.id};go('catalog')" style="cursor:pointer;">
                    <div class="cat-card text-center">
                      <div class="cat-icon mx-auto" style="background:${c.color}10;">
                        <i class="fas ${c.icon}" style="color:${c.color};"></i>
                      </div>
                      <div class="fw-600" style="font-size:0.6rem;">${c.nom}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Promos -->
            ${promos.length ? `
              <section class="py-4" style="background:linear-gradient(90deg,rgba(196,93,44,0.04),rgba(212,160,23,0.04));">
                <div class="container">
                  <h5 class="fw-800 text-brown mb-3"><span class="sec-bar"></span>Promotions</h5>
                  <div class="row g-3">
                    ${promos.map(p => `
                      <div class="col-12 col-sm-6 col-xl-3">
                        ${pCard(p)}
                      </div>
                    `).join('')}
                  </div>
                </div>
              </section>
            ` : ''}

            <!-- Produits populaires + Panier -->
            <div class="container py-4">
              <div class="row">
                <div class="col-lg-9">

                  <div class="row g-3" id="prod-zone">
                    ${pop.map(p => `
                      <div class="col-12 col-sm-6 col-xl-4">
                        ${pCard(p)}
                      </div>

                <div class="col-lg-3 d-none d-lg-block">

              </div>
            </div>

            <!-- Panier mobile -->
            <div id="cart-zone-mobile" class="d-lg-none container pb-3">
              ${cartSB()}
            </div>

            <!-- Statistiques -->
            <section class="bg-brown text-white py-5 mt-4">
              <div class="container">
                <div class="row g-3 text-center">
                  <div class="col-3">
                    <div class="p-3 rounded-3 bg-white bg-opacity-10">
                      <i class="fas fa-store fs-2 text-accent"></i>
                      <div class="fw-800 fs-3">500+</div>
                      <div style="font-size:0.75rem;opacity:0.5;">Vendeurs</div>
                    </div>
                  </div>
                  <div class="col-3">
                    <div class="p-3 rounded-3 bg-white bg-opacity-10">
                      <i class="fas fa-box fs-2 text-accent"></i>
                      <div class="fw-800 fs-3">2 500+</div>
                      <div style="font-size:0.75rem;opacity:0.5;">Produits</div>
                    </div>

                      <i class="fas fa-truck fs-2 text-accent"></i>
                      <div class="fw-800 fs-3">10 000+</div>
                      <div style="font-size:0.75rem;opacity:0.5;">Commandes</div>
                    </div>
                  </div>
                  <div class="col-3">
                    <div class="p-3 rounded-3 bg-white bg-opacity-10">
                      <i class="fas fa-face-smile fs-2 text-accent"></i>
                      <div class="fw-800 fs-3">98%</div>
                      <div style="font-size:0.75rem;opacity:0.5;">Satisfaits</div>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          `;
        }

        /* ===== CARTE PRODUIT ===== */

        function pCard(p) {
            const v = ven(p.vendeurId);
            const prix = p.prixPromo || p.prix;
            const liked = S.user && p.likes.includes(S.user.id);
            const lkN = p.likes.length;

            return `
            <div class="p-card">
              <div class="d-flex align-items-center gap-2 p-2">
                ${avHTML(v.photo,v.nom,30,10)}
                <div style="min-width:0;">
                  <div class="fw-600 text-brown" style="font-size:0.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${v.nom}</div>
                  <div class="text-brown-muted" style="font-size:0.6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${v.boutique}</div>
                </div>
              </div>
              <div class="p-img" onclick="go('product',${p.id})">
                ${p.enPromotion ? `<div class="badge-promo"><i class="fas fa-tag me-1"></i>Promo</div>` : ''}
                <img src="${p.images[0]}" alt="${p.nom}" loading="lazy">
                <button id="like-${p.id}" onclick="event.stopPropagation();toggleLike(${p.id})" 
                        class="like-btn ${liked?'liked':''}">
                  <i class="fa-${liked?'solid':'regular'} fa-heart ${liked?'text-danger':'text-brown-muted'}"></i>
                </button>
              </div>
              <div class="p-2">
                <div class="text-brown-muted" style="font-size:0.6rem;"><i class="fas fa-tag me-1"></i>${catN(p.categorieId)}</div>
                <h6 class="fw-600 text-brown mb-1" style="font-size:0.8rem;cursor:pointer;" onclick="go('product',${p.id})">${p.nom}</h6>
                <p class="text-brown-muted" style="font-size:0.7rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${p.description}</p>
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <div>
                    <span class="fw-700 text-primary" style="font-size:1.1rem;">${fmt(prix,p.devise)}</span>
                    ${p.enPromotion ? `<span class="text-brown-muted text-decoration-line-through" style="font-size:0.65rem;">${fmt(p.prix,p.devise)}</span>` : ''}
                    <div style="font-size:0.6rem;color:var(--brown-muted);">/ ${p.unite}</div>
                  </div>
                  <div class="d-flex align-items-center gap-1" style="font-size:0.7rem;">
                    <i class="fa-${liked?'solid':'regular'} fa-heart ${liked?'text-danger':'text-brown-muted'}"></i>
                    <span class="${lkN?'fw-600':'text-brown-muted'}">${lkN||''}</span>
                  </div>
                </div>
                <button onclick="event.stopPropagation();addCart(${p.id})" 
                        class="btn w-100 py-1 rounded-pill fw-600" 
                        style="font-size:0.75rem;${p.stock<=0?'background:#e5e7eb;color:#9ca3af;cursor:not-allowed;':'background:var(--brown);color:#fff;'}"
                        ${p.stock<=0?'disabled':''}>
                  <i class="fas fa-plus me-1"></i> ${p.stock<=0?'Rupture':'Ajouter au panier'}
                </button>
              </div>
            </div>
          `;
        }

        /* ===== PANIER ===== */

        function cartSB() {
            const entries = Object.entries(cartByCurrency());
            const totalsHTML = entries.length ?
                entries.map(e =>
                    `<div class="d-flex justify-content-between" style="font-size:0.75rem;">
                  <span class="text-brown-muted">${e[0]} :</span>
                  <span class="fw-700 text-primary">${fmt(e[1].total,e[0])}</span>
                </div>`
                ).join('') :
                `<div class="text-brown-muted" style="font-size:0.75rem;">Vide</div>`;

            let cartItemsHTML = '';
            if (S.cart.length) {
                S.cart.forEach(c => {
                    const p = S.products.find(x => x.id === c.pid);
                    if (!p) return;
                    const v = ven(p.vendeurId);
                    cartItemsHTML += `
                <div class="c-it">
                  ${avHTML(v.photo,v.nom,24,8)}
                  <div class="c-inf">
                    <div class="c-nm">${p.nom}</div>
                    <div class="c-pr">${fmt(p.prixPromo||p.prix,p.devise)}</div>
                  </div>
                  <div class="c-qty">
                    <button onclick="updQty(${p.id},-1)">−</button>
                    <span>${c.qty}</span>
                    <button onclick="updQty(${p.id},1)">+</button>
                  </div>
                  <button class="c-rm" onclick="rmCart(${p.id})"><i class="fas fa-times"></i></button>
                </div>
              `;
                });
            } else {
                cartItemsHTML = `
              <div class="c-emp">
                <i class="fas fa-bag-shopping"></i>
                <p style="font-size:0.75rem;">Panier vide</p>
              </div>
            `;
            }

            const dis = S.cart.length ? '' : 'disabled style="opacity:.5;cursor:not-allowed;"';

            return `
            <div class="cart-side">
              <div class="cart-hd">
                <i class="fas fa-shopping-basket text-primary"></i>
                <h6 class="fw-700 mb-0">Mon panier</h6>
                <span class="ms-auto bg-primary bg-opacity-10 text-primary px-2 py-0 rounded-pill fw-700" style="font-size:0.7rem;">${cartN()}</span>
              </div>
              <div class="c-list">
                ${cartItemsHTML}
              </div>
              <div class="c-ft">
                <div class="c-tot flex-column align-items-start gap-0">
                  <span class="fw-700">Total :</span>
                  <div class="w-100 mt-1">${totalsHTML}</div>
                </div>
                <button class="btn-ck" onclick="goCk()" ${dis}>
                  <i class="fas fa-lock me-1"></i> Commander
                </button>
                <button class="btn-cl" onclick="clrCart()">
                  <i class="fas fa-trash-alt me-1"></i> Vider
                </button>
              </div>
            </div>
          `;
        }

        /* ===== CATALOGUE ===== */

        function pgCat() {
            let ps = [...S.products].filter(p => p.actif !== false);
            const f = S.filters;
            if (f.q) ps = ps.filter(p => p.nom.toLowerCase().includes(f.q.toLowerCase()));
            if (f.catId) ps = ps.filter(p => p.categorieId === f.catId);
            if (f.tri === 'populaire') ps.sort((a, b) => b.ventes - a.ventes);
            else if (f.tri === 'likes') ps.sort((a, b) => b.likes.length - a.likes.length);
            else ps.sort((a, b) => new Date(b.datePublication) - new Date(a.datePublication));

            return `
            <div class="container py-3">
              <nav style="font-size:0.75rem;color:var(--brown-muted);">

                <i class="fas fa-chevron-right mx-1" style="font-size:0.6rem;"></i>
                <span class="text-brown fw-500">${f.catId?catN(f.catId):'Tous'}</span>
              </nav>

              <div class="row mt-3">
                <div class="col-lg-9">
                  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">

                      <span class="fw-700 text-brown">${ps.length}</span> produits
                    </span>
                    <div class="d-flex gap-2">
                      <select class="form-select form-select-sm rounded-pill border-border" style="font-size:0.75rem;width:auto;"
                              onchange="S.filters.catId=this.value?parseInt(this.value):null;go('catalog')">
                        <option value="">Catégories</option>
                        ${CATS.map(c => `
                          <option value="${c.id}" ${f.catId===c.id?'selected':''}>${c.nom}</option>
                        `).join('')}
                      </select>
                      <select class="form-select form-select-sm rounded-pill border-border" style="font-size:0.75rem;width:auto;"
                              onchange="S.filters.tri=this.value;go('catalog')">
                        <option value="recent" ${f.tri==='recent'?'selected':''}>Récents</option>
                        <option value="populaire" ${f.tri==='populaire'?'selected':''}>Populaires</option>
                        <option value="likes" ${f.tri==='likes'?'selected':''}>Plus aimés</option>
                      </select>
                    </div>
                  </div>

                  ${ps.length ? `
                    <div class="row g-3">
                      ${ps.map(p => `
                        <div class="col-12 col-sm-6 col-xl-4">
                          ${pCard(p)}
                        </div>
                      `).join('')}
                    </div>
                  ` : `
                    <div class="text-center py-5">
                      <i class="fas fa-box-open" style="font-size:3rem;color:var(--brown-muted);opacity:0.2;"></i>
                      <h5 class="fw-700 text-brown mt-3">Aucun produit</h5>
                    </div>
                  `}
                </div>
                <div class="col-lg-3 d-none d-lg-block">
                  ${cartSB()}
                </div>
              </div>
              <!-- Panier mobile -->
              <div class="d-lg-none mt-4" id="cart-zone-mobile">
                ${cartSB()}
              </div>
            </div>
          `;
        }

        /* ===== DÉTAIL PRODUIT ===== */

        function pgProd() {
            const p = S.products.find(x => x.id === S.params);
            if (!p) return '';
            const v = ven(p.vendeurId);
            const liked = S.user && p.likes.includes(S.user.id);

            return `
            <div class="container py-3">
              <nav style="font-size:0.75rem;color:var(--brown-muted);">
                <a onclick="go('home')" class="text-decoration-none hover-primary" style="cursor:pointer;">Accueil</a>
                <i class="fas fa-chevron-right mx-1" style="font-size:0.6rem;"></i>
                <a onclick="S.filters.catId=${p.categorieId};go('catalog')" class="text-decoration-none hover-primary" style="cursor:pointer;">${catN(p.categorieId)}</a>
                <i class="fas fa-chevron-right mx-1" style="font-size:0.6rem;"></i>
                <span class="text-brown fw-500">${p.nom}</span>
              </nav>

              <div class="row mt-3">
                <div class="col-lg-9">
                  <div class="bg-white rounded-3 border border-border overflow-hidden">
                    <div class="d-flex align-items-center gap-2 p-3 border-bottom border-border">
                      ${avHTML(v.photo,v.nom,36,12)}
                      <div>
                        <div class="fw-600">${v.nom}</div>
                        <div style="font-size:0.75rem;color:var(--brown-muted);">${v.boutique} · ${stars(v.note)} ${v.note}</div>
                      </div>
                    </div>
                    <div class="row g-0">
                      <div class="col-md-6">
                        <img id="mI" src="${p.images[0]}" class="w-100" style="aspect-ratio:1/1;object-fit:cover;">
                        <div class="d-flex gap-2 p-2">
                          ${p.images.map((im,i) => `
                            <div class="rounded-2 overflow-hidden border-2 ${i===0?'border-primary':'border-transparent'}" 
                                 style="width:48px;height:48px;cursor:pointer;" 
                                 onclick="document.getElementById('mI').src='${im}'">
                              <img src="${im}" class="w-100 h-100 object-fit-cover">
                            </div>
                          `).join('')}
                        </div>
                      </div>
                      <div class="col-md-6 p-3">
                        <span class="badge bg-primary bg-opacity-10 text-primary rounded-pill" style="font-size:0.65rem;font-weight:500;">${catN(p.categorieId)}</span>
                        <h4 class="fw-800 text-brown mt-2">${p.nom}</h4>
                        <div class="d-flex align-items-center gap-2 mb-2">
                          ${stars(p.note)} <span style="font-size:0.75rem;color:var(--brown-muted);">${p.note}/5 · ${p.ventes} vendus</span>
                        </div>
                        <div class="d-flex align-items-center gap-3 mb-3">
                          <div>
                            <span class="fw-800 text-primary" style="font-size:1.4rem;">${fmt(p.prixPromo||p.prix,p.devise)}</span>
                            <span style="font-size:0.8rem;color:var(--brown-muted);">/ ${p.unite}</span>
                            ${p.enPromotion ? `<span class="text-brown-muted text-decoration-line-through" style="font-size:0.8rem;margin-left:6px;">${fmt(p.prix,p.devise)}</span>` : ''}
                          </div>
                          <button id="like-${p.id}" onclick="toggleLike(${p.id})" 
                                  class="like-btn ${liked?'liked':''}" 
                                  style="position:static;border-radius:30px;padding:6px 16px;width:auto;height:auto;gap:6px;background:${liked?'rgba(220,53,69,0.08)':'transparent'};border:1px solid ${liked?'var(--danger)':'var(--border)'};">
                            <i class="fa-${liked?'solid':'regular'} fa-heart ${liked?'text-danger':'text-brown-muted'}"></i>
                            <span style="font-size:0.8rem;font-weight:600;">${p.likes.length}</span>
                          </button>
                        </div>
                        <p style="font-size:0.85rem;color:var(--brown-muted);line-height:1.6;">${p.description}</p>
                        <button onclick="addCart(${p.id})" 
                                class="btn w-100 py-2 rounded-pill fw-700" 
                                style="font-size:0.85rem;${p.stock<=0?'background:#e5e7eb;color:#9ca3af;cursor:not-allowed;':'background:var(--secondary);color:#fff;'}"
                                ${p.stock<=0?'disabled':''}>

        /* ===== CHECKOUT AVEC CONFIRMATION ===== */

        function goCk() {
            if (!S.cart.length) { toast('Panier vide', 'err'); return; }
            if (!S.user) { toast('Connectez-vous d\'abord', 'err');
                go('login'); return; }

            // Vérifier si les produits sont d'un seul vendeur
            const vendeursSet = {};
            S.cart.forEach(c => {
                const p = S.products.find(x => x.id === c.pid);
                if (p) vendeursSet[p.vendeurId] = true;
            });
            const nbVendeurs = Object.keys(vendeursSet).length;

            if (nbVendeurs > 1) {
                let htmlVendeurs = '';
                Object.keys(vendeursSet).forEach(vid => {
                    const v = ven(parseInt(vid));
                    const nb = S.cart.filter(c => {
                        const p = S.products.find(x => x.id === c.pid);
                        return p && p.vendeurId === parseInt(vid);
                    }).length;
                    htmlVendeurs += `
                <div class="d-flex justify-content-between py-1">
                  <div class="d-flex align-items-center gap-2">
                    ${avHTML(v.photo,v.nom,22,8)}
                    <span style="font-size:0.8rem;">${v.boutique}</span>
                  </div>
                  <span style="font-size:0.7rem;color:var(--brown-muted);">${nb} article(s)</span>
                </div>
              `;
                });

                openMod(`
              <div class="p-4 text-center">
                <div class="bg-warning bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width:64px;height:64px;">
                  <i class="fas fa-exclamation-triangle text-warning" style="font-size:1.5rem;"></i>
                </div>
                <h5 class="fw-800">⚠️ Plusieurs vendeurs détectés</h5>
                <p style="font-size:0.8rem;color:var(--brown-muted);">Pour éviter les pertes, une commande ne peut contenir que des produits d'<strong>un seul vendeur</strong>.</p>
                <div class="bg-cream rounded-3 p-3 text-start mb-3">
                  <div style="font-size:0.7rem;font-weight:700;color:var(--brown);">Vendeurs dans votre panier :</div>
                  ${htmlVendeurs}
                </div>
                <div class="d-flex gap-2">
                  <button onclick="S.cart=[];save();closeModal();renderAll();toast('Panier vidé','inf')" 
                          class="btn btn-danger-custom flex-grow-1">Vider le panier</button>
                  <button onclick="closeModal()" class="btn btn-outline-custom flex-grow-1">Compris</button>
                </div>
              </div>
            `);
                return;
            }

            go('checkout');
        }

        function pgCk() {
            if (!S.cart.length) { go('home'); return ''; }

            const u = S.user;
            const bySeller = {};
            S.cart.forEach(c => {
                const p = S.products.find(x => x.id === c.pid);
                if (!p) return;
                if (!bySeller[p.vendeurId]) bySeller[p.vendeurId] = [];
                bySeller[p.vendeurId].push({ pid: c.pid, qty: c.qty, product: p });
            });

            const sk = Object.keys(bySeller);
            const vid = parseInt(sk[0]);
            const items = bySeller[vid];
            const v = ven(vid);

            const tots = {};
            items.forEach(it => {
                const dv = it.product.devise;
                if (!tots[dv]) tots[dv] = 0;
                tots[dv] += (it.product.prixPromo || it.product.prix) * it.qty;
            });

            let totsHTML = '';
            Object.keys(tots).forEach(dv => {
                totsHTML += `
              <div class="d-flex justify-content-between fw-800" style="font-size:1.1rem;">
                <span>${dv}</span>
                <span class="text-primary">${fmt(tots[dv],dv)}</span>
              </div>
            `;
            });

            let itemsHTML = '';
            items.forEach(it => {
                const px = it.product.prixPromo || it.product.prix;
                itemsHTML += `
              <div class="d-flex align-items-center gap-2 p-2 bg-cream-dark rounded-3">
                <img src="${it.product.images[0]}" class="rounded-3" style="width:40px;height:40px;object-fit:cover;flex-shrink:0;">
                <div class="flex-grow-1" style="min-width:0;">
                  <div class="fw-600" style="font-size:0.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${it.product.nom}</div>
                  <div style="font-size:0.7rem;color:var(--brown-muted);">${fmt(px,it.product.devise)} x ${it.qty} ${it.product.unite}</div>
                </div>
                <span class="fw-700 text-primary" style="font-size:0.8rem;white-space:nowrap;">${fmt(px*it.qty,it.product.devise)}</span>
              </div>
            `;
            });

            return `
            <div class="container py-3" style="max-width:720px;">
              <button onclick="go('home')" class="btn-bk mb-3">
                <i class="fas fa-arrow-left me-1"></i> Retour
              </button>

              <div class="bg-white rounded-3 border border-border overflow-hidden">
                <div class="bg-gradient-to-r from-secondary to-secondary-light text-white p-4">
                  <h5 class="fw-800 mb-0">📋 Confirmation de commande</h5>
                  <div style="font-size:0.8rem;opacity:0.6;">Vérifiez vos informations avant de valider</div>
                </div>

                <div class="p-4">
                  <!-- Vendeur -->
                  <div class="d-flex align-items-center gap-3 p-3 bg-cream rounded-3 mb-3">
                    ${avHTML(v.photo,v.nom,40,13)}
                    <div>
                      <div class="fw-600">${v.boutique}</div>
                      <div style="font-size:0.75rem;color:var(--brown-muted);">Vendeur : ${v.nom}</div>
                    </div>
                  </div>

                  <!-- Informations client -->
                  <div class="mb-3">
                    <h6 class="fw-700 text-brown mb-2"><i class="fas fa-user text-primary me-1"></i>Vos informations</h6>
                    <div class="row g-2">
                      <div class="col-12 col-sm-6">
                        <label style="font-size:0.7rem;font-weight:600;color:var(--brown-muted);">Nom complet *</label>
                        <input id="ckNom" class="fi" value="${u.nom||''}" placeholder="Votre nom">
                      </div>
                      <div class="col-12 col-sm-6">
                        <label style="font-size:0.7rem;font-weight:600;color:var(--brown-muted);">Téléphone *</label>
                        <input id="ckTel" class="fi" value="${u.tel||''}" placeholder="+243 ...">
                      </div>
                      <div class="col-12 col-sm-6">
                        <label style="font-size:0.7rem;font-weight:600;color:var(--brown-muted);">Quartier *</label>
                        <input id="ckQuartier" class="fi" value="${u.quartier||''}" placeholder="Ex: Market, Kasuku">
                      </div>
                      <div class="col-12 col-sm-6">
                        <label style="font-size:0.7rem;font-weight:600;color:var(--brown-muted);">Avenue</label>
                        <input id="ckAvenue" class="fi" value="${u.avenue||''}" placeholder="Avenue Kasuku">
                      </div>
                      <div class="col-12">
                        <label style="font-size:0.7rem;font-weight:600;color:var(--brown-muted);">Adresse complète</label>
                        <input id="ckAddr" class="fi" value="${u.adresse||''}" placeholder="Numéro de parcelle, repère...">
                      </div>
                      <div class="col-12">
                        <label style="font-size:0.7rem;font-weight:600;color:var(--brown-muted);">Note pour le vendeur</label>
                        <textarea id="ckNote" class="fi" rows="2" placeholder="Instructions spéciales..."></textarea>
                      </div>
                    </div>
                  </div>

                  <!-- Articles -->
                  <div class="mb-3">
                    <h6 class="fw-700 text-brown mb-2">📦 Articles (${items.length})</h6>
                    <div class="d-flex flex-column gap-2">
                      ${itemsHTML}
                    </div>
                  </div>

                  <!-- Total -->
                  <div class="p-3 rounded-3 mb-3" style="background:linear-gradient(90deg,rgba(196,93,44,0.06),rgba(212,160,23,0.06));border:1px solid rgba(196,93,44,0.12);">
                    <div style="font-size:0.7rem;font-weight:600;color:var(--brown-muted);">💰 TOTAL À PAYER</div>
                    ${totsHTML}
                    <div style="font-size:0.7rem;color:var(--brown-muted);margin-top:4px;">Paiement via Mobile Money après confirmation</div>
                  </div>

                  <!-- Bouton -->
                  <button onclick="placeOrder()" class="btn-confirm">
                    <i class="fas fa-paper-plane"></i> ✅ Passer la commande
                  </button>
                  <div style="font-size:0.7rem;color:var(--brown-muted);text-align:center;margin-top:6px;">
                    <i class="fas fa-info-circle me-1"></i> Après validation, vous serez redirigé vers la messagerie avec ${v.nom}
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        /* ===== PLACER UNE COMMANDE ===== */

        function placeOrder() {
            const u = S.user;
            if (!u) return;

            const nom = document.getElementById('ckNom')?.value?.trim();
            const tel = document.getElementById('ckTel')?.value?.trim();
            const quartier = document.getElementById('ckQuartier')?.value?.trim();
            const avenue = document.getElementById('ckAvenue')?.value?.trim() || '';
            const addr = document.getElementById('ckAddr')?.value?.trim() || '';
            const note = document.getElementById('ckNote')?.value?.trim() || '';

            if (!nom || !tel || !quartier) {
                toast('Remplissez nom, téléphone et quartier', 'err');
                return;
            }

            u.nom = nom;
            u.tel = tel;
            u.quartier = quartier;
            u.avenue = avenue;
            if (addr) u.adresse = addr;
            save();

            // Regrouper par vendeur
            const bySeller = {};
            S.cart.forEach(c => {
                const p = S.products.find(x => x.id === c.pid);
                if (!p) return;
                if (!bySeller[p.vendeurId]) bySeller[p.vendeurId] = [];
                bySeller[p.vendeurId].push({ pid: c.pid, qty: c.qty, product: p });
            });

            const sk = Object.keys(bySeller);
            if (!sk.length) { toast('Panier vide', 'err'); return; }

            const vid = parseInt(sk[0]);
            const items = bySeller[vid];
            const v = ven(vid);
            if (!v) { toast('Vendeur non trouvé', 'err'); return; }

            const oid = 'UVM-' + Math.random().toString(36).substr(2, 7).toUpperCase();

            // Calculer les totaux
            const tots = {};
            items.forEach(it => {
                const dv = it.product.devise;
                if (!tots[dv]) tots[dv] = 0;
                tots[dv] += (it.product.prixPromo || it.product.prix) * it.qty;
            });

            const totauxArray = Object.keys(tots).map(dv => ({ devise: dv, montant: tots[dv] }));

            const orderItems = items.map(it => ({
                productId: it.pid,
                nom: it.product.nom,
                qty: it.qty,
                prix: it.product.prixPromo || it.product.prix,
                devise: it.product.devise,
                unite: it.product.unite
            }));

            S.orders.push({
                id: oid,
                acheteurId: u.id,
                acheteurNom: u.nom,
                acheteurTel: u.tel,
                vendeurId: vid,
                vendeurNom: v.nom,
                date: new Date().toISOString().slice(0, 16).replace('T', ' '),
                statut: 'en_attente',
                items: orderItems,
                totaux: totauxArray,
                livraison: { quartier, avenue, adresse: addr, note },
                livreurId: null
            });

            // Créer la conversation avec le vendeur
            const cid = 'cmd-' + oid;
            let msgTexte = `Bonjour ${v.nom}, je viens de passer la commande ${oid} chez ${v.boutique||'votre boutique'}.\n\n`;
            msgTexte += '📦 Détails de la commande :\n';
            orderItems.forEach(it => {
                msgTexte += `• ${it.nom} x${it.qty} (${fmt(it.prix*it.qty,it.devise)})\n`;
            });
            msgTexte += `\n📍 Livraison : ${quartier}`;
            if (avenue) msgTexte += `, ${avenue}`;
            if (addr) msgTexte += `, ${addr}`;
            if (note) msgTexte += `\n📝 Note : ${note}`;
            msgTexte += '\n\nMerci de confirmer la réception !';

            S.msgs.push({
                id: Date.now() + Math.random(),
                convId: cid,
                type: 'commande',
                orderId: oid,
                from: u.id,
                fromN: u.nom,
                fromPh: u.photo || null,
                participants: [u.id, vid],
                texte: msgTexte,
                date: new Date().toISOString().slice(0, 16).replace('T', ' '),
                lu: []
            });

            addNotif(`Nouvelle commande ${oid} de ${u.nom}`, 'fa-box');
            S.cart = [];
            save();
            toast(`✅ Commande ${oid} passée avec succès !`);
            S.chatConvId = cid;
            go('messages');
        }

        /* ===== MESSAGERIE AVEC ENVOI D'IMAGES/VIDÉOS ===== */

        function getConvs(userId) {
            const convMap = {};
            S.msgs.forEach(m => {
                if (!m.participants || !m.participants.includes(userId)) return;
                if (!convMap[m.convId]) {
                    convMap[m.convId] = {
                        id: m.convId,
                        type: m.type,
                        orderId: m.orderId,
                        participants: m.participants,
                        messages: []
                    };
                }
                convMap[m.convId].messages.push(m);
            });

            return Object.values(convMap).map(conv => {
                conv.messages.sort((a, b) => new Date(a.date) - new Date(b.date));
                const last = conv.messages[conv.messages.length - 1];

                const otherIds = conv.participants.filter(p => p !== userId);
                let otherName = 'Conversation';
                let otherPhoto = null;

                if (otherIds.length === 1) {
                    const oid = otherIds[0];
                    const v = VEND.find(x => x.id === oid);
                    const l = LIVREURS.find(x => x.id === oid);
                    if (v) { otherName = v.boutique;
                        otherPhoto = v.photo; } else if (l) { otherName = l.nom + ' (Livreur)';
                        otherPhoto = l.photo; } else {
                        const mf = conv.messages.find(m => m.from === oid);
                        if (mf) { otherName = mf.fromN;
                            otherPhoto = mf.fromPh; }
                    }
                } else {
                    otherName = conv.orderId || 'Groupe commande';
                }

                const unread = conv.messages.filter(m => m.from !== userId && !m.lu.includes(userId)).length;

                return { ...conv, otherName, otherPhoto, lastMsg: last, lastMsgDate: last?.date, unread };
            }).sort((a, b) => new Date(b.lastMsgDate) - new Date(a.lastMsgDate));
        }

        function markConvRead(cid, uid) {
            S.msgs.forEach(m => {
                if (m.convId === cid && m.from !== uid && !m.lu.includes(uid)) {
                    m.lu.push(uid);
                }
            });
            save();
        }

        function sendMessage(cid, texte, mediaData) {
            if (!texte?.trim() && !mediaData) return;
            if (!S.user) return;

            const conv = S.msgs.find(m => m.convId === cid);
            const parts = conv ? conv.participants : [S.user.id];

            const msg = {
                id: Date.now() + Math.random(),
                convId: cid,
                type: conv?.type || 'prive',
                orderId: conv?.orderId || null,
                from: S.user.id,
                fromN: S.user.nom,
                fromPh: S.user.photo,
                participants: [...parts],
                texte: texte?.trim() || '',
                date: new Date().toISOString().slice(0, 16).replace('T', ' '),
                lu: [],
                media: mediaData || null
            };

            S.msgs.push(msg);
            save();
            renderAll();
            setTimeout(scrollChat, 50);
        }

        function handleMsgFile(input) {
            const file = input.files[0];
            if (!file) return;

            // Vérifier la taille (max 5MB)
            if (file.size > 5 * 1024 * 1024) {
                toast('Fichier trop volumineux (max 5MB)', 'err');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = e.target.result;
                const convId = S.chatConvId;
                if (!convId) { toast('Aucune conversation active', 'err'); return; }

                let mediaType = 'image';
                if (file.type.startsWith('video/')) mediaType = 'video';
                else if (file.type.startsWith('audio/')) mediaType = 'audio';

                sendMessage(convId, `📎 ${file.name}`, {
                    type: mediaType,
                    data: data,
                    name: file.name,
                    size: file.size
                });
                input.value = '';
            };
            reader.readAsDataURL(file);
        }

        function scrollChat() {
            const ca = document.getElementById('chatArea');
            if (ca) ca.scrollTop = ca.scrollHeight;
        }

        function readIcon(msg, uid) {
            if (msg.from !== uid) return '';
            const others = msg.participants ? msg.participants.filter(p => p !== msg.from) : [];
            const allRead = others.length > 0 && others.every(o => msg.lu.includes(o));
            return allRead ?
                '<i class="fas fa-check-double chk-read ms-1"></i>' :
                '<i class="fas fa-check chk-unread ms-1"></i>';
        }

        function pgMsgs() {
            if (!S.user) { toast('Connectez-vous', 'err');
                go('login'); return ''; }

            const convs = getConvs(S.user.id);
            const activeConv = S.chatConvId ? convs.find(c => c.id === S.chatConvId) : convs[0];
            if (activeConv) markConvRead(activeConv.id, S.user.id);

            return `
            <div class="container py-3">
              <h5 class="fw-800 text-brown mb-3"><span class="sec-bar"></span>Messages</h5>

              <div class="bg-white rounded-3 border border-border overflow-hidden" style="min-height:500px;">
                <div class="row g-0" style="min-height:500px;">
                  <div class="col-md-4 border-end border-border">
                    <div class="p-2 border-bottom border-border">
                      <input type="text" class="fi" style="font-size:0.8rem;padding:6px 12px;" placeholder="Rechercher...">
                    </div>
                    <div class="chat-list">
                      ${convs.length ? convs.map(c => `
                        <div class="conv-item ${activeConv?.id===c.id?'active':''}" 
                             onclick="S.chatConvId='${c.id}';renderAll();setTimeout(scrollChat,50)">
                          ${avHTML(c.otherPhoto,c.otherName,38,13)}
                          <div class="flex-grow-1" style="min-width:0;">
                            <div class="d-flex justify-content-between align-items-center">
                              <div class="fw-600" style="font-size:0.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${c.otherName}</div>
                              ${c.unread ? `<span class="unread-badge">${c.unread}</span>` : ''}
                            </div>
                            <div style="font-size:0.7rem;color:var(--brown-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${c.lastMsg?.texte||''}</div>
                            <div class="d-flex justify-content-between align-items-center mt-1">
                              <span style="font-size:0.6rem;color:var(--brown-muted);">${fmtT(c.lastMsgDate)}</span>
                              ${c.orderId ? `<span style="font-size:0.55rem;background:rgba(196,93,44,0.08);color:var(--primary);padding:1px 8px;border-radius:50px;font-weight:600;">${c.orderId}</span>` : ''}
                            </div>
                          </div>
                        </div>
                      `).join('') : `
                        <div class="text-center py-5 text-brown-muted" style="font-size:0.8rem;">
                          <i class="fas fa-comments" style="font-size:2rem;opacity:0.2;display:block;margin-bottom:8px;"></i>
                          Aucune conversation
                        </div>
                      `}
                    </div>
                  </div>

                  <div class="col-md-8 d-flex flex-column">
                    ${activeConv ? `
                      <div class="d-flex align-items-center gap-2 p-3 border-bottom border-border">
                        ${avHTML(activeConv.otherPhoto,activeConv.otherName,32,11)}
                        <div class="flex-grow-1" style="min-width:0;">
                          <div class="fw-600">${activeConv.otherName}</div>
                          ${activeConv.orderId ? `<div style="font-size:0.7rem;color:var(--primary);font-weight:600;">${activeConv.orderId}</div>` : `<div style="font-size:0.7rem;color:var(--brown-muted);">Privé</div>`}
                        </div>
                        ${activeConv.participants.length > 2 ? `
                          <div class="d-flex" style="margin-left:-8px;">
                            ${activeConv.participants.filter(p=>p!==S.user.id).slice(0,3).map(pid => {
                              const v = VEND.find(x=>x.id===pid);
                              const l = LIVREURS.find(x=>x.id===pid);
                              return avHTML(v?v.photo:l?.photo, v?v.nom:l?.nom||'?', 22, 8);
                            }).join('')}
                          </div>
                        ` : ''}
                      </div>

                      <div class="chat-area" id="chatArea">
                        ${activeConv.messages.map(m => {
                          if (m.system) return `<div class="msg-system">${m.texte}</div>`;
                          const mine = m.from === S.user.id;
                          const fi = mine ? {nom:S.user.nom,photo:S.user.photo} : {nom:m.fromN,photo:m.fromPh};
                          let mediaHTML = '';
                          if (m.media) {
                            if (m.media.type === 'image') {
                              mediaHTML = `<img src="${m.media.data}" class="msg-media" alt="Image">`;
                            } else if (m.media.type === 'video') {
                              mediaHTML = `<video controls class="msg-media"><source src="${m.media.data}"></video>`;
                            } else if (m.media.type === 'audio') {
                              mediaHTML = `<audio controls src="${m.media.data}" style="width:180px;"></audio>`;
                            }
                          }
                          return `
                            <div class="d-flex ${mine?'justify-content-end':'justify-content-start'} gap-2">
                              ${!mine ? avHTML(fi.photo,fi.nom,28,9) : ''}
                              <div class="${mine?'text-end':''}">
                                ${!mine ? `<div style="font-size:0.65rem;color:var(--brown-muted);font-weight:500;">${fi.nom}</div>` : ''}
                                ${mediaHTML}
                                ${m.texte ? `<div class="msg-bubble ${mine?'msg-mine':'msg-other'}">${m.texte}</div>` : ''}
                                <div class="d-flex ${mine?'justify-content-end':'justify-content-start'} align-items-center gap-1 mt-1">
                                  <span class="msg-time">${fmtT(m.date)}</span>
                                  ${readIcon(m,S.user.id)}
                                </div>
                              </div>
                              ${mine ? avHTML(fi.photo,fi.nom,28,9) : ''}
                            </div>
                          `;
                        }).join('')}
                      </div>

                      <div class="p-3 border-top border-border d-flex gap-2 align-items-center">
                        <input id="msgInput" type="text" class="fi flex-grow-1" style="font-size:0.8rem;padding:8px 14px;" 
                               placeholder="Écrire un message..." 
                               onkeydown="if(event.key==='Enter'){sendMessage('${activeConv.id}',this.value);this.value=''}">

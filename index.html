                        <label style="font-size:0.7rem;font-weight:600;color:var(--brown-muted);">Nouveau mot de passe</label>
                        <input id="profNewPwd" class="fi" type="password" placeholder="••••••••">
                      </div>
                      <div class="col-12 col-sm-6">
                        <label style="font-size:0.7rem;font-weight:600;color:var(--brown-muted);">Confirmer</label>

                      </button>

        function updateProfTerritoires() {
            const province = document.getElementById('profProvince').value;
            const sel = document.getElementById('profTerritoire');
            sel.innerHTML = '<option value="">-- Sélectionner --</option>';
            if (province && PROVINCES[province]) {
                PROVINCES[province].forEach(t => {
                    sel.innerHTML += `<option value="${t}">${t}</option>`;
                });
            }
        }

        function changePhoto(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            if (file.size > 2 * 1024 * 1024) { toast('Image trop grande (max 2MB)', 'err'); return; }
            const reader = new FileReader();
            reader.onload = function(e) {
                S.user.photo = e.target.result;
                save();
                toast('Photo mise à jour');
                renderAll();
            };
            reader.readAsDataURL(file);
        }

        function saveProfile() {
            const u = S.user;
            if (!u) return;
            const nom = document.getElementById('profNom').value.trim();
            const tel = document.getElementById('profTel').value.trim();
            const email = document.getElementById('profEmail').value.trim();
            const sexe = document.getElementById('profSexe').value;
            const province = document.getElementById('profProvince').value;
            const territoire = document.getElementById('profTerritoire').value;
            const quartier = document.getElementById('profQuartier').value.trim();
            const avenue = document.getElementById('profAvenue').value.trim();
            const adresse = document.getElementById('profAddr').value.trim();

            if (!nom) { toast('Le nom est obligatoire', 'err');
                document.getElementById('profNom').focus(); return; }
            if (!tel) { toast('Le téléphone est obligatoire', 'err');
                document.getElementById('profTel').focus(); return; }

            u.nom = nom;
            u.tel = tel;
            u.email = email;
            u.sexe = sexe;
            u.province = province;
            u.territoire = territoire;
            u.quartier = quartier;
            u.avenue = avenue;
            u.adresse = adresse;
            save();
            toast('Profil mis à jour avec succès !');
            renderAll();
        }

        function changePassword() {
            const oldPwd = document.getElementById('profOldPwd').value;
            const newPwd = document.getElementById('profNewPwd').value;
            const confPwd = document.getElementById('profConfPwd').value;

            if (!oldPwd || !newPwd || !confPwd) { toast('Remplissez tous les champs', 'err'); return; }
            if (newPwd !== confPwd) { toast('Les mots de passe ne correspondent pas', 'err'); return; }
            if (newPwd.length < 6) { toast('Le mot de passe doit avoir au moins 6 caractères', 'err'); return; }

            if (S.user.password && oldPwd !== S.user.password) {
                toast('Ancien mot de passe incorrect', 'err');
                return;
            }

            S.user.password = newPwd;
            save();
            toast('Mot de passe changé avec succès !');
            document.getElementById('profOldPwd').value = '';
            document.getElementById('profNewPwd').value = '';
            document.getElementById('profConfPwd').value = '';
        }

            openMod(`
            <div class="p-4 text-center">
              <i class="fas fa-exclamation-triangle text-danger" style="font-size:2rem;"></i>
              <h6 class="fw-700 text-brown mt-2">Effacer mes données ?</h6>
              <p style="font-size:0.8rem;color:var(--brown-muted);">Vos commandes, messages et favoris seront supprimés. Votre compte restera actif.</p>
              <div class="d-flex gap-2 justify-content-center mt-3">
                <button onclick="confirmClearData()" class="btn btn-danger-custom">Confirmer</button>
                <button onclick="closeModal()" class="btn btn-outline-custom">Annuler</button>
              </div>
            </div>
          `);
        }

        function confirmClearData() {
            S.orders = S.orders.filter(o => o.acheteurId !== S.user.id);
            S.msgs = S.msgs.filter(m => !m.participants || m.participants.indexOf(S.user.id) === -1);
            S.cart = [];
            S.notifs = [];
            save();
            closeModal();
            toast('Données effacées');
            renderAll();
        }

        function deleteAccount() {
            openMod(`
            <div class="p-4 text-center">
              <i class="fas fa-skull-crossbones text-danger" style="font-size:2rem;"></i>
              <h6 class="fw-700 text-brown mt-2">Supprimer mon compte ?</h6>
              <p style="font-size:0.8rem;color:var(--brown-muted);">Cette action est IRRÉVERSIBLE. Toutes vos données seront perdues.</p>
              <div class="d-flex gap-2 justify-content-center mt-3">
                <button onclick="confirmDeleteAccount()" class="btn btn-danger-custom">Supprimer définitivement</button>
                <button onclick="closeModal()" class="btn btn-outline-custom">Annuler</button>
              </div>
            </div>
          `);
        }

        function confirmDeleteAccount() {
            S.orders = S.orders.filter(o => o.acheteurId !== S.user.id);
            S.msgs = S.msgs.filter(m => !m.participants || m.participants.indexOf(S.user.id) === -1);
            S.cart = [];
            S.notifs = [];
            S.user = null;
            localStorage.removeItem('uv5_user');
            closeModal();
            toast('Compte supprimé', 'inf');
            go('home');

        function checkPwdStrength(pwd) {
            const bar = document.getElementById('pwd-bar');
            const txt = document.getElementById('pwd-strength-text');
            if (!bar || !txt) return;

            let score = 0;
            if (pwd.length >= 6) score++;
            if (pwd.length >= 8) score++;
            if (/[A-Z]/.test(pwd)) score++;
            if (/[0-9]/.test(pwd)) score++;
            if (/[^A-Za-z0-9]/.test(pwd)) score++;

            const levels = [
                { w: '0%', c: '#ddd', t: '' },
                { w: '20%', c: '#ef4444', t: 'Très faible' },
                { w: '40%', c: '#f97316', t: 'Faible' },
                { w: '60%', c: '#eab308', t: 'Moyen' },
                { w: '80%', c: '#22c55e', t: 'Fort' },
                { w: '100%', c: '#16a34a', t: 'Très fort' }
            ];

            const l = levels[score];
            bar.style.width = l.w;
            bar.style.backgroundColor = l.c;
            txt.textContent = l.t;
            txt.style.color = l.c;
        }

        async function doRegister() {
            const nom = document.getElementById('reg-nom').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const tel = document.getElementById('reg-tel').value.trim();
            const role = document.getElementById('reg-role').value;

            const pwd2 = document.getElementById('reg-pwd2').value;
            const errBox = document.getElementById('reg-err');
            const btn = document.getElementById('reg-btn');

            if (!nom || !email || !pwd || !pwd2) {
                errBox.classList.remove('d-none');
                errBox.querySelector('span').textContent = 'Remplissez tous les champs obligatoires.';
                return;

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                errBox.classList.remove('d-none');
                errBox.querySelector('span').textContent = 'Email invalide.';
                return;
            }
            if (pwd !== pwd2) {
                errBox.classList.remove('d-none');
                errBox.querySelector('span').textContent = 'Les mots de passe ne correspondent pas.';
                return;
            }

            btn.disabled = true;

            const result = await registerUser(nom, email, pwd, role);
            if (result.ok) {

        function initAC() {
            if (S.adminTab !== 'vue-densemble') return;

            const chartFont = { family: 'DM Sans', size: 10 };
            const gridColor = 'rgba(45,24,16,0.06)';

            const cv = document.getElementById('adminChartVentes');
            if (cv) {
                const old = Chart.getChart(cv);
                if (old) old.destroy();
                const mois = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Jun', 'Jul', 'Aoû', 'Sep', 'Oct', 'Nov', 'Déc'];
                const ventesParMois = Array(12).fill(0);
                S.orders.forEach(o => {
                    if (o.statut === 'annulee') return;
                    const m = parseInt((o.date || '').split('-')[1]) - 1;
                    if (m >= 0 && m < 12) {
                        const totalFC = o.totaux.filter(t => t.devise === 'FC').reduce((s, t) => s + t.montant, 0);
                        ventesParMois[m] += totalFC;
                    }
                });
                new Chart(cv, {
                    type: 'line',
                    data: {
                        labels: mois,
                        datasets: [{
                            label: 'Ventes (FC)',
                            data: ventesParMois,
                            borderColor: '#C45D2C',
                            backgroundColor: 'rgba(196,93,44,0.1)',
                            fill: true,
                            tension: .4,
                            pointRadius: 3,
                            pointBackgroundColor: '#C45D2C'
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { color: gridColor }, ticks: { font: chartFont,
                                    callback: v => new Intl.NumberFormat('fr-FR').format(v) } },
                            x: { grid: { display: false }, ticks: { font: chartFont } }
                        }
                    }
                });
            }

            const cc = document.getElementById('adminChartCats');
            if (cc) {
                const old = Chart.getChart(cc);
                if (old) old.destroy();
                const catCounts = {};
                S.products.forEach(p => {
                    const n = catN(p.categorieId);
                    catCounts[n] = (catCounts[n] || 0) + 1;
                });
                const colors = ['#C45D2C', '#2D6A4F', '#D4A017', '#1E6091', '#9B2335', '#5C4D7D', '#8B6914', '#34495E',
                    '#7D6B5D', '#A0522D', '#2C3E50'
                ];
                new Chart(cc, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(catCounts),
                        datasets: [{ data: Object.values(catCounts), backgroundColor: colors, borderWidth: 0 }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'right', labels: { font: { ...chartFont, size: 9 }, padding: 6,
                                    boxWidth: 10 } }
                        }
                    }
                });
            }

            const cu = document.getElementById('adminChartUsers');
            if (cu) {
                const old = Chart.getChart(cu);
                if (old) old.destroy();
                const mois = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Jun'];
                const totalUsers = VEND.length + LIVREURS.length;
                const growth = mois.map((_, i) => Math.round(totalUsers * (0.15 + i * 0.15) + Math.random() * 3));
                new Chart(cu, {
                    type: 'bar',
                    data: {
                        labels: mois,
                        datasets: [{ label: 'Utilisateurs', data: growth,
                            backgroundColor: 'rgba(27,67,50,0.7)', borderRadius: 6, barThickness: 28 }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { color: gridColor }, ticks: { font: chartFont } },
                            x: { grid: { display: false }, ticks: { font: chartFont } }
                        }
                    }
                });
            }

            const cp = document.getElementById('adminChartPaiement');
            if (cp) {
                const old = Chart.getChart(cp);
                if (old) old.destroy();
                let fcCount = 0,
                    usdCount = 0,
                    livCount = 0;
                S.orders.forEach(o => {
                    if (o.statut === 'annulee') return;
                    o.totaux.forEach(t => {
                        if (t.devise === 'FC') fcCount++;
                        else usdCount++;
                    });
                    if (o.livreurId) livCount++;
                });
                new Chart(cp, {
                    type: 'doughnut',
                    data: {
                        labels: ['Airtel Money', 'Orange Money', 'M-Pesa', 'À la livraison'],
                        datasets: [{ data: [Math.round(fcCount * 0.4) || 1, Math.round(fcCount * 0.35) || 1,
                                Math.round(fcCount * 0.25) || 1, livCount || 1
                            ], backgroundColor: ['#E53935', '#FF9800', '#2D6A4F', '#D4A017'], borderWidth: 0 }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom', labels: { font: { ...chartFont, size: 10 }, padding: 10,
                                    boxWidth: 12 } }
                        }
                    }
                });
            }
        }

        function adminSaveUser(id, role) {
            const nom = document.getElementById('auNom')?.value?.trim();
            if (!nom) { toast('Nom requis', 'err'); return; }

            if (role === 'vendeur') {
                const u = VEND.find(x => x.id === id);
                if (u) {
                    u.nom = nom;
                    u.tel = document.getElementById('auTel')?.value || u.tel;
                    u.boutique = document.getElementById('auBout')?.value || u.boutique;
                    u.devise = document.getElementById('auDev')?.value || u.devise;
                    u.quartier = document.getElementById('auQuart')?.value || u.quartier;
                    u.avenue = document.getElementById('auAv')?.value || u.avenue;
                }
            } else {
                const u = LIVREURS.find(x => x.id === id);
                if (u) { u.nom = nom;
                    u.tel = document.getElementById('auTel')?.value || u.tel; }
            }
            save();
            closeModal();
            toast('Utilisateur modifié');
            renderAll();
        }

        function adminToggleUser(id, role) {
            if (role === 'vendeur') {
                const u = VEND.find(x => x.id === id);

            } else {
                const u = LIVREURS.find(x => x.id === id);

        function adminAddCat() {
            const nom = document.getElementById('newCatNom')?.value?.trim();
            const icon = document.getElementById('newCatIcon')?.value;
            const color = document.getElementById('newCatColor')?.value || '#C45D2C';
            if (!nom) { toast('Nom requis', 'err'); return; }
            CATS.push({ id: Math.max(...CATS.map(c => c.id), 0) + 1, nom, icon: icon || 'fa-tag', color });
            save();
            toast('Catégorie ajoutée');
            renderAll();
        }

        function adminDeleteCat(cid) {
            const i = CATS.findIndex(c => c.id === cid);
            if (i > -1) { CATS.splice(i, 1);
                save();
                toast('Catégorie supprimée');
                renderAll(); }
        }

        function adminAddLivreur() {
            const nom = document.getElementById('newLivNom')?.value?.trim();
            const tel = document.getElementById('newLivTel')?.value?.trim();
            if (!nom || !tel) { toast('Nom et téléphone requis', 'err'); return; }
            LIVREURS.push({ id: 200 + Math.floor(Math.random() * 900), nom, tel,
                photo: `https://picsum.photos/seed/liv${Date.now()}/100/100`, disponible: true });
            save();
            toast('Livreur ajouté');
            renderAll();
        }

        function handleProdImg(inp) {
            const f = inp.files[0];
            if (!f) return;
            if (f.size > 2 * 1024 * 1024) { toast('Max 2 Mo', 'err'); return; }

            const r = new FileReader();
            r.onload = e => {
                prodImgData = e.target.result;
                document.getElementById('prodImgPv').innerHTML = `
                <img src="${e.target.result}" style="width:80px;height:80px;object-fit:cover;border-radius:10px;border:2px solid var(--primary);margin:0 auto;">
                <p style="font-size:0.6rem;color:var(--success);font-weight:600;"><i class="fas fa-check-circle"></i> Image chargée</p>
              `;
            };
            r.readAsDataURL(f);
        }

        function saveProd(pid) {
            const nom = document.getElementById('pfNom')?.value?.trim();
            const catId = parseInt(document.getElementById('pfCat')?.value);
            const unite = document.getElementById('pfUnite')?.value;
            const prix = parseFloat(document.getElementById('pfPrix')?.value);
            const devise = document.getElementById('pfDev')?.value;
            const stock = parseInt(document.getElementById('pfStock')?.value);
            const promo = parseFloat(document.getElementById('pfPromo')?.value) || null;
            const desc = document.getElementById('pfDesc')?.value?.trim();

            if (!nom || !catId || !unite || !prix || !stock || !desc) {
                toast('Remplissez les champs obligatoires', 'err');
                return;
            }

            if (!pid && !prodImgData) {
                toast('Téléchargez une photo du produit', 'err');
                return;
            }

            const img1 = prodImgData ||
                `https://images.unsplash.com/photo-1596545352303-3be60a53b176?w=400&h=400&fit=crop&q=80`;

            if (pid) {
                const p = S.products.find(x => x.id === pid);
                if (p) {
                    p.nom = nom;
                    p.categorieId = catId;
                    p.unite = unite;
                    p.prix = prix;
                    p.devise = devise;
                    p.stock = stock;
                    p.prixPromo = promo && promo < prix ? promo : null;
                    p.enPromotion = !!(promo && promo < prix);
                    p.description = desc;
                    if (prodImgData) p.images[0] = img1;
                }
            } else {
                const newId = Math.max(...S.products.map(x => x.id), 0) + 1;
                S.products.push({
                    id: newId,
                    nom,
                    categorieId: catId,
                    prix,
                    prixPromo: promo && promo < prix ? promo : null,
                    unite,
                    description: desc,
                    devise,
                    images: [img1, img1],
                    vendeurId: S.user.id,
                    stock,
                    commune: "Uvira",
                    note: 0,
                    nbAvis: 0,
                    datePublication: new Date().toISOString().slice(0, 10),
                    enPromotion: !!(promo && promo < prix),
                    ventes: 0,
                    likes: [],
                    actif: true
                });
            }

            prodImgData = null;
            save();
            closeModal();
            toast(pid ? 'Produit modifié' : 'Produit publié');
            renderAll();
        }

        function toggleProdActif(pid) {

        function updateOrderSt(oid, st) {
            const o = S.orders.find(x => x.id === oid);
            if (!o) return;
            o.statut = st;
            save();

            const labels = {
                confirmee: 'confirmée',
                en_preparation: 'en préparation',
                en_livraison: 'en livraison',
                livree: 'livrée',
                annulee: 'annulée'
            };

            S.msgs.push({
                id: Date.now() + Math.random(),
                convId: 'cmd-' + oid,
                type: 'commande',
                orderId: oid,
                from: o.vendeurId,
                fromN: 'Système',
                fromPh: null,
                participants: o.livreurId ? [o.acheteurId, o.vendeurId, o.livreurId] : [o.acheteurId, o.vendeurId],
                texte: `Commande ${oid} ${labels[st]||st}.`,
                date: new Date().toISOString().slice(0, 16).replace('T', ' '),
                lu: [],
                system: true
            });

            save();
            toast('Statut mis à jour');
            renderAll();
            if (S.dashTab === 'statistiques') setTimeout(initVC, 80);

        function assignLivreur(oid, lid) {
            const o = S.orders.find(x => x.id === oid);
            if (!o) return;
            o.livreurId = lid;
            o.statut = 'en_livraison';
            const l = livreur(lid);

            S.msgs.filter(m => m.convId === 'cmd-' + oid).forEach(m => {
                if (!m.participants.includes(lid)) m.participants.push(lid);
            });

            S.msgs.push({
                id: Date.now() + Math.random(),
                convId: 'cmd-' + oid,
                type: 'commande',
                orderId: oid,
                from: o.vendeurId,
                fromN: 'Système',
                fromPh: null,
                participants: [o.acheteurId, o.vendeurId, lid],
                texte: `Livreur ${l.nom} assigné. En route pour la livraison.`,
                date: new Date().toISOString().slice(0, 16).replace('T', ' '),
                lu: [],
                system: true
            });

            addNotif(`Livreur ${l.nom} assigné à ${oid}`, 'fa-truck');
            save();
            closeModal();
            toast('Livreur assigné !');
            renderAll();
        }

        /* ===== STATS VENDEUR ===== */

        function initVC() {
            if (S.dashTab !== 'statistiques') return;

            const my = S.orders.filter(o => o.vendeurId === S.user.id);

            const sc = {};
            my.forEach(o => { sc[o.statut] = (sc[o.statut] || 0) + 1; });
            const cs = document.getElementById('chartStatus');
            if (cs) {
                const old = Chart.getChart(cs);
                if (old) old.destroy();
                new Chart(cs, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(sc).map(s => ({ en_attente: 'En attente', confirmee: 'Confirmée',
                            en_preparation: 'En préparation', en_livraison: 'En livraison', livree: 'Livrée',
                            annulee: 'Annulée' } [s] || s)),
                        datasets: [{ data: Object.values(sc), backgroundColor: ['#EAB308', '#3B82F6', '#F97316',
                                '#8B5CF6', '#22C55E', '#EF4444'
                            ], borderWidth: 0 }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { position: 'bottom', labels: { font: { size: 10, family: 'DM Sans' },
                                    padding: 8 } } }
                    }
                });
            }

            const rev = {};
            my.forEach(o => {
                if (o.statut === 'annulee') return;
                o.totaux.forEach(t => { rev[t.devise] = (rev[t.devise] || 0) + t.montant; });
            });
            const cr = document.getElementById('chartRevenue');
            if (cr) {
                const old = Chart.getChart(cr);
                if (old) old.destroy();
                new Chart(cr, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(rev),
                        datasets: [{ label: 'Revenus', data: Object.values(rev), backgroundColor: ['#C45D2C',
                                '#D4A017', '#2D6A4F'
                            ], borderRadius: 8, barThickness: 40 }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, ticks: { font: { size: 10 } } },
                            x: { ticks: { font: { size: 11, weight: 'bold' } } }
                        }
                    }
                });
            }
        }
